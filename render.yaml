# Render Blueprint — provisions the backend API, Postgres, and Redis together.
# https://render.com/docs/blueprint-spec
#
# Usage: connect this repo in the Render dashboard as a "Blueprint", or run
# `render blueprint launch`. Any env var marked `sync: false` will prompt you
# for a value in the dashboard instead of being stored here — use that for
# every secret (JWT signing keys, Google OAuth client secret, SMTP password).

databases:
  - name: happystore-db
    plan: starter
    postgresMajorVersion: 16
    # Render's managed Postgres supports enabling PostGIS after creation:
    #   psql $DATABASE_URL -c "CREATE EXTENSION IF NOT EXISTS postgis;"
    # (there's no blueprint field for this — it's a one-time manual step,
    # see the deployment guide.)

services:
  - type: redis
    name: happystore-redis
    plan: starter
    ipAllowList: [] # only reachable from other services in this Render project

  - type: web
    name: happystore-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    # Runs before each deploy goes live — applies pending Prisma migrations.
    preDeployCommand: npm run db:deploy
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: happystore-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: happystore-redis
          property: connectionString
      # Must be your actual deployed frontend URL(s) — see the deployment guide.
      # Comma-separate multiple origins, e.g. "https://happystore.vercel.app,https://www.happystore.com".
      - key: CORS_ORIGIN
        sync: false
      # "none" if frontend/backend are on different domains (default for
      # Render + Vercel without a shared custom domain); "lax" if they share
      # one parent domain (e.g. api.happystore.com + app.happystore.com).
      - key: COOKIE_SAME_SITE
        value: none
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Must exactly match the redirect URI registered in Google Cloud Console.
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
